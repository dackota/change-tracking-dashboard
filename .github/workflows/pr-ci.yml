name: PR CI

# Required checks for every pull request targeting main: Go build/vet/test
# and a Grype filesystem/dependency scan.
#
# - changes     -> dorny/paths-filter computes which path groups this PR
#                  touches, so go-verify can skip cleanly (a "skipped"
#                  check-run, not an absent one) on a CI-only PR --
#                  release-please.yml's auto-merge check-runs poll already
#                  treats "skipped" as passing.
# - go-verify   -> go build ./..., go vet ./..., go test ./..., then
#                  go test -race over the concurrency-heavy packages (fails
#                  the check on the first failing step). Only runs when the PR
#                  touches Go source or module files -- a workflow-only PR
#                  has nothing for it to verify.
# - grype-fs    -> scans the working tree's dependency graph (go.sum, etc.)
#                  the same way publish.yml scans the built image: HIGH/CRITICAL,
#                  fixed-only findings fail the check before anything merges.
#
# Hardening (same posture as publish.yml):
#   - every `uses:` is pinned to a full commit SHA (trailing comment records
#     the version tag);
#   - permissions default to `contents: read` — no job needs more, since none
#     of them push an image or write PR content, except
#     `changes`, which reads `pull-requests: read` because paths-filter
#     always lists a PR's changed files via the GitHub API on a pull_request
#     trigger (confirmed against its docs — a checkout doesn't change this,
#     only push/branch workflows use local git diffing).
#
# PR title format (Conventional Commits) is enforced by the separate
# pr-title-lint.yml workflow, not here, so an in-flight code review isn't
# re-run every time the title is edited.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed path groups
    runs-on: ubuntu-latest
    # On a pull_request trigger, paths-filter always lists changed files via
    # the GitHub API (a checkout doesn't change this -- confirmed against its
    # own docs: local git diffing is only used for push/branch workflows), so
    # this job needs pull-requests: read. Scoped to just this job -- the
    # workflow's other jobs stay at the top-level contents: read only.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
    steps:
      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'

  go-verify:
    name: Go build, vet, test
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      # The race detector, scoped to the packages that actually run
      # concurrent code. internal/chartdiff and internal/plandiff sit on
      # the internal/subtree seam and carry the repo's concurrency-dense
      # logic (two semaphores, singleflight coalescing, per-call timeouts,
      # recover() blocks, and background "abandoned goroutine" waiters
      # whose temp-dir cleanup handoff must happen exactly once and only
      # after the goroutine has stopped touching the directory); poller
      # and scheduler drive them from background loops, and store/web are
      # the shared state those loops write through.
      #
      # Scoped rather than ./... because -race costs roughly 2-10x per
      # package and internal/store alone is already ~20s -- the packages
      # left out (pure parsers, renderers, formatters) have no goroutines
      # for the detector to find anything in.
      #
      # ubuntu-latest ships gcc and defaults to CGO_ENABLED=1, which
      # -race requires; CGO_ENABLED is set explicitly so a future change
      # to the runner image or the toolchain default fails loudly here
      # instead of silently dropping the check.
      - name: go test -race (concurrency-heavy packages)
        env:
          CGO_ENABLED: "1"
        run: |
          go test -race -count=1 \
            ./internal/chartdiff/... \
            ./internal/plandiff/... \
            ./internal/subtree/... \
            ./internal/poller/... \
            ./internal/scheduler/... \
            ./internal/store/... \
            ./internal/web/...

  grype-fs-scan:
    name: Grype filesystem/dependency scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan dependencies (Grype) — fail on HIGH/CRITICAL
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          path: "."
          output-format: table
          fail-build: "true"
          only-fixed: "true"
          severity-cutoff: high
